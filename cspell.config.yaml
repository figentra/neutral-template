# Stackra file contract:
# Purpose: spelling for the whole repository: British English with US English accepted, the project
#          words, and the retired name `figentra-flow` forbidden in every case (Stackra ADR 0529 d5).
# Boundary: dictionary and ignores only; adding an ignore path needs a reason beside it.
# Runtime: node
# Governing contract: Stackra ADR 0300 decision 5 (spell checking), Stackra ADR 0529 (decision 5)
version: "0.2"
language: en-GB,en
# Files git ignores are never checked.
useGitignore: true
ignorePaths:
  # Rendered by `fflow sync` from its preset, never hand-edited (.flow/lock.json pins them).
  - ".agents/**"
  - ".claude/**"
  - ".opencode/**"
  - .github/workflows/fflow-*.yml
  - .github/CODEOWNERS
  - AGENTS.md
  - CLAUDE.md
  - README.md
  - .mcp.yaml
  - lefthook.yml
  - opencode.jsonc
  - .flow/lock.json
  - "**/node_modules/**"
words:
  # the shell keyword, in workflow scripts
  - elif
  - actionlint
  - automerge
  - commitlint
  - fflow
  - Figentra
  - gitleaks
  - lefthook
  - linguist
  - oxfmt
  - oxlint
  - renovatebot
  - sops
  - Stackra
  - Testbed
flagWords:
  - figentra-flow
  - figentra_flow
  - FIGENTRA_FLOW
