# Stackra file contract:
# Purpose: the Quality Gate of a neutral repository: secrets scan, formatting, spelling, workflow lint,
#          the pull request's commit messages and the Flow gate (`fflow gate ci`: rendered files unchanged,
#          specs pass). It needs no credential and no workspace install; a repository that adds a workspace
#          adds its own steps after these.
# Boundary: read-only: contents read, no token, no secret. Tools come from mise.toml; Flow and commitlint
#           run from npx at pinned versions.
# Runtime: node
# Governing contract: Stackra ADR 0019 (supply-chain hardening), Stackra ADR 0027 (tools in mise),
#                     Stackra ADR 0526 (layout), Stackra ADR 0528 (the neutral template)
name: CI

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Stackra ADR 0019: nothing by default; the job asks for what it needs.
permissions: {}

jobs:
  gate:
    name: Quality Gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Figentra Flow's open scope is read from the Stackra registry.
      NPM_CONFIG_@FIGENTRA-OSS:REGISTRY: https://npm.stackra.figentra.com/
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Toolchain (mise)
        uses: jdx/mise-action@9b200bcecbfd6303e69a4a261b2e09e3757440a7 # v5.2.0
        with:
          install_args: node gitleaks aqua:rhysd/actionlint npm:oxfmt npm:cspell

      - name: Secrets scan (gitleaks)
        run: gitleaks git . --config .gitleaks.toml --no-banner --redact

      - name: Format (oxfmt)
        run: oxfmt --check .

      - name: Spelling (cspell)
        run: cspell lint --no-progress --dot --gitignore "**/*.{md,mdx,yaml,yml,json,jsonc,json5,toml}"

      - name: Workflow lint (actionlint)
        run: actionlint

      # The pull request's own commits; the title arrives through the environment, never interpolated.
      - name: Commit messages (commitlint)
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx -y -p @commitlint/cli@21.2.3 -p @commitlint/config-conventional@21.2.0 \
            commitlint --from "$BASE_SHA" --to "$HEAD_SHA"

      # Rendered files match .flow/lock.json, and the specs pass.
      - name: Flow gate
        run: npx -y -p @figentra-oss/flow@0.6.4 fflow gate ci

      # planned (STA-2203): `stackra validate --repository` runs the layout check here once a released
      # @stackra/cli carries it and runs without a workspace.
