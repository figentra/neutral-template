# Stackra file contract:
# Purpose: conventional commits for the commit-msg hook and the CI gate. A repository without a workspace
#          runs commitlint with the conventional preset from npx; one with a workspace may extend
#          @stackra/commitlint-config instead.
# Boundary: commit message rules only.
# Runtime: node
# Governing contract: Stackra ADR 0528 (the neutral template)
extends:
  - "@commitlint/config-conventional"
rules:
  body-max-line-length:
    - 2
    - always
    - 100
