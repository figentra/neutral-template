# Generated by fflow from the neutral preset 0.6.4: do not edit; change .flow/overrides/ and run `fflow sync`.
pre-commit:
  parallel: true
  jobs:
    - name: oxfmt
      glob:
        - "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
        - "*.{json,jsonc,json5,yaml,yml,toml,md,mdx}"
        - "*.{css,scss,less,html,graphql,vue}"
      exclude:
        - ".agents/hooks/fflow-guard.mjs"
      run: |
        sh -c 'if command -v mise >/dev/null 2>&1; then
        exec mise exec npm:oxfmt -- oxfmt --check --no-error-on-unmatched-pattern "$@"; fi;
        exec node_modules/.bin/oxfmt --check --no-error-on-unmatched-pattern "$@"' -- {staged_files}
    - name: oxlint
      glob: "*.{ts,tsx,mts,cts,js,jsx,mjs,cjs}"
      exclude:
        - ".agents/hooks/fflow-guard.mjs"
      run: |
        sh -c 'if command -v mise >/dev/null 2>&1; then exec mise exec npm:oxlint -- oxlint "$@"; fi; exec node_modules/.bin/oxlint "$@"' -- {staged_files}
commit-msg:
  jobs:
    - name: commitlint
      run: |
        if [ -x node_modules/.bin/commitlint ]; then
          node_modules/.bin/commitlint --edit {1}
        else
          echo "commitlint not installed (install the workspace); CI checks the pull request's commits"
        fi
pre-push:
  jobs:
    - name: spec-branch
      run: |
        out="$( {
        if [ -f node_modules/@figentra-oss/flow/bin/fflow.mjs ]; then
          node node_modules/@figentra-oss/flow/bin/fflow.mjs gate branch
        fi
        } 2>&1 )"; s=$?
        printf '%s\n' "$out"
        if [ $s -ne 0 ] && printf '%s' "$out" | grep -qE 'ERR_PNPM_FETCH_401|(ERR_PNPM_META_FETCH_FAIL|Lockfile failed supply-chain policy check).*[^0-9]401([^0-9]|$)'; then
          echo "pre-push skipped: pnpm cannot read the registry on this machine (401); the PR must cite a box run for this commit"
          exit 0
        fi
        exit $s
